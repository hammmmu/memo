<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>打勾備忘錄</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="備忘錄">
<meta name="theme-color" content="#f2f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f131a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
/* Layout: phone app shell. Sticky top bar + category chips, task cards grouped by when they are due,
   swipe a card right for 星號 / 延遲 / 刪除, floating + button, bottom tab bar (任務 / 計畫 / 前置 / 日曆 / 我的). */
:root {
  --bg: #f2f4f8;
  --card: #ffffff;
  --ink: #1d2433;
  --muted: #8a93a3;
  --line: #e3e7ee;
  --accent: #0a9cf5;
  --accent-soft: #d9efff;
  --chip: #e8ebf0;
  --late: #c8102e;
  --star: #f5b400;
  --snooze: #f07b28;
  --del: #e5484d;
  --warn-soft: #fff1e6;
  --ok: #1f9d55;
  --shade: rgba(16, 22, 34, .38);
  --f-body: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0f131a; --card: #1a2029; --ink: #e7eaf0; --muted: #7d8696; --line: #2a313c;
  --accent: #3fb3ff; --accent-soft: #143650; --chip: #232a35; --late: #ff6b7d; --warn-soft: #3a2414; --ok: #4cc38a; --shade: rgba(0,0,0,.55);
  color-scheme: dark } }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
html { padding-top: env(safe-area-inset-top, 0px) }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  -webkit-user-select: none; user-select: none; overscroll-behavior-y: none }
input, select, textarea { -webkit-user-select: text; user-select: text }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
button, input, select { font: inherit; color: inherit }
button { cursor: pointer; background: none; border: 0; padding: 0 }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
svg { display: block }
[hidden] { display: none !important }
.app { max-width: 560px; margin: 0 auto; padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px)) }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px 6px; display: flex; flex-direction: column; gap: 10px }
.bar { display: flex; align-items: center; gap: 6px }
.bar h1 { font-size: 20px; font-weight: 700; margin: 0 auto 0 4px }
.ibtn { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: var(--ink) }
.search { display: flex; gap: 8px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px }
.search input { border: 0; background: none; flex: 1; min-width: 0; outline: none; font-size: 16px }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px }
.chips::-webkit-scrollbar { display: none }
.chip { flex: none; background: var(--chip); color: var(--muted); border-radius: 999px; padding: 6px 16px; font-size: 15px; white-space: nowrap }
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600 }
.chip.more { padding: 6px 12px }

/* task groups */
main { display: flex; flex-direction: column; gap: 6px; padding-block: 6px 16px }
.sec-h { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; padding: 12px 2px 6px; width: 100% }
.sec-h .n { font-size: 12px }
.sec-h svg { transition: transform .15s }
.sec-h[aria-expanded="false"] svg { transform: rotate(180deg) }
.cards { display: flex; flex-direction: column; gap: 10px }
.hint { font-size: 12px; color: var(--muted); text-align: center; padding: 4px 0 0 }

/* swipe row: actions sit behind the card on the left, card slides right to reveal them */
.swipe { position: relative; border-radius: 10px; overflow: hidden; background: var(--card) }
.swipe-acts { position: absolute; inset: 0 auto 0 0; display: flex; width: 216px }
.swipe-acts button { width: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #fff; font-size: 12px; font-weight: 600 }
.swipe-acts .a-star { background: var(--star) }
.swipe-acts .a-snooze { background: var(--snooze) }
.swipe-acts .a-del { background: var(--del) }
.card { position: relative; background: var(--card); display: grid; grid-template-columns: 46px 1fr auto; align-items: center; min-height: 64px; padding: 8px 4px 8px 0;
  touch-action: pan-y; will-change: transform; transition: transform .22s cubic-bezier(.2,.8,.2,1) }
.card.dragging { transition: none }
.tick { width: 46px; height: 46px; display: grid; place-items: center }
.tick span { width: 23px; height: 23px; border-radius: 50%; border: 1.5px solid #b5bcc8; display: grid; place-items: center }
.card.done .tick span { background: #c3c9d3; border-color: #c3c9d3 }
.card.done .tick span::after { content: ""; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg) }
.body { min-width: 0; text-align: left; padding: 4px 0; display: flex; flex-direction: column; gap: 2px }
.title { overflow-wrap: anywhere; display: flex; gap: 4px; align-items: baseline }
.title .st { color: var(--star); flex: none }
.meta { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); flex-wrap: wrap }
.meta .late { color: var(--late) }
.meta .cat { background: var(--chip); border-radius: 4px; padding: 0 6px }
.meta .on-cal { color: var(--accent) }
.card.done .title { color: var(--muted); text-decoration: line-through }
.card.done .meta, .card.done .meta .late { color: var(--muted); opacity: .7 }
.acts .ibtn { width: 42px; height: 42px; color: var(--accent) }
.subtog { font-size: 12px; color: var(--muted); background: var(--chip); border-radius: 999px; padding: 3px 9px; font-variant-numeric: tabular-nums }
.subs { grid-column: 1 / -1; padding: 0 12px 6px 46px; display: flex; flex-direction: column }
.subs .add-item { padding-top: 6px }
.acts { display: flex; align-items: center; gap: 2px }
.all-done { color: var(--muted); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; align-self: center; padding: 18px 8px }
.empty { color: var(--muted); text-align: center; padding: 48px 16px; display: flex; flex-direction: column; gap: 12px; align-items: center }
.ghost { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 18px; font-size: 14px; color: var(--ink) }

/* fab + tabbar */
.fab { position: fixed; right: max(calc(20px + env(safe-area-inset-right, 0px)), calc(50% - 260px)); bottom: calc(82px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; box-shadow: 0 6px 18px rgba(10,156,245,.35); z-index: 6 }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px) }
.tabbar .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr) }
.tabbar button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 6px; font-size: 11px; color: var(--muted) }
.tabbar button[aria-current="page"] { color: var(--accent) }

/* calendar view */
.month { background: var(--card); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px }
.month-h { display: flex; align-items: center; justify-content: space-between; font-weight: 700 }
.grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; gap: 2px }
.grid .wd { font-size: 12px; color: var(--muted); padding: 4px 0 }
.day { aspect-ratio: 1; max-width: 100%; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; position: relative; font-variant-numeric: tabular-nums }
.day.out { color: var(--muted); opacity: .45 }
.day.today { color: var(--accent); font-weight: 700 }
.day.sel { background: var(--accent); color: #fff }
.day .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); position: absolute; bottom: 14% }
.day.sel .dot { background: #fff }

/* me view */
.panel { background: var(--card); border-radius: 12px; padding: 4px 14px; display: flex; flex-direction: column }
.panel + .panel { margin-top: 12px }
.panel h2 { font-size: 13px; color: var(--muted); font-weight: 500; margin: 12px 0 4px }
.row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line) }
.panel h2 + .row { border-top: 0 }
.row .grow { flex: 1; min-width: 0 }
.row input[type=text] { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 7px 10px; width: 100%; font-size: 16px }
.txt-btn { color: var(--accent); font-size: 15px; padding: 4px 6px }
.txt-btn.danger { color: var(--del) }
.note { font-size: 13px; color: var(--muted); line-height: 1.65; padding: 6px 0 12px; margin: 0 }

/* bottom sheet */
.shade { position: fixed; inset: 0; background: var(--shade); z-index: 20; display: flex; align-items: flex-end; justify-content: center }
.sheet { background: var(--card); width: 100%; max-width: 560px; border-radius: 16px 16px 0 0; padding-block: 10px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; max-height: 92%; overflow-y: auto }
.grab { width: 36px; height: 4px; border-radius: 2px; background: var(--line); align-self: center }
.sheet h3 { margin: 0; font-size: 17px }
.sheet .sub { margin: -6px 0 0; font-size: 13px; color: var(--muted) }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted) }
.field input, .field select { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; color: var(--ink); font-size: 16px; width: 100%; min-width: 0; min-height: 44px }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.quick { display: flex; gap: 6px; flex-wrap: wrap }
.quick button { background: var(--chip); border-radius: 999px; padding: 6px 14px; font-size: 14px; color: var(--ink) }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-size: 15px }
.switch small { display: block; color: var(--muted); font-size: 12px }
.switch input { width: 24px; height: 24px; accent-color: var(--accent); flex: none }
.btns { display: flex; gap: 10px }
.btn { flex: 1; text-align: center; border-radius: 12px; padding: 13px; font-weight: 600; text-decoration: none; display: block }
.btn.pri { background: var(--accent); color: #fff }
.btn.sec { background: var(--chip); color: var(--ink) }
.btn.cal { background: var(--accent-soft); color: var(--accent) }
.menu { display: flex; flex-direction: column; background: var(--bg); border-radius: 12px; overflow: hidden }
.menu button { display: flex; justify-content: space-between; align-items: center; padding: 14px; border-top: 1px solid var(--line); text-align: left; font-size: 16px }
.menu button:first-child { border-top: 0 }
.menu button small { color: var(--muted); font-size: 13px }
.confirm { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(152px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--card); padding: 10px 16px; border-radius: 999px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); display: flex; gap: 14px; align-items: center; white-space: nowrap }
.toast span { overflow: hidden; text-overflow: ellipsis }
.toast button { color: var(--accent); font-weight: 700; flex: none }

/* 後製 / 前置 cards */
.pcard { background: var(--card); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px; text-align: left; width: 100% }
.pcard-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px }
.pcard-h b { font-size: 16px; overflow-wrap: anywhere; min-width: 0 }
.pcard-h .pct { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; flex: none }
.pbar { height: 8px; background: var(--chip); border-radius: 4px; overflow: hidden }
.pbar i { display: block; height: 100%; background: var(--accent); border-radius: 4px }
.pbar.full i { background: var(--ok) }
.pmeta { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted) }
.due { font-weight: 600; color: var(--ink) }
.due.warn { color: var(--late) }
.badge { background: var(--snooze); color: #fff; border-radius: 999px; font-size: 12px; padding: 1px 8px; font-weight: 600 }
.kind { background: var(--chip); border-radius: 4px; padding: 0 6px; font-size: 12px; color: var(--muted) }
.banner { background: var(--warn-soft); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 14px }
.banner b { color: var(--snooze) }
.banner button { text-align: left; display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px }
.banner button span:last-child { color: var(--snooze); font-weight: 600; flex: none }
.big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap }
.big b { font-size: 46px; line-height: 1; font-variant-numeric: tabular-nums }
.big span { color: var(--muted); font-size: 14px }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px }
.stats div { background: var(--bg); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column }
.stats small { color: var(--muted); font-size: 12px }
.stats b { font-size: 17px; font-variant-numeric: tabular-nums }
input[type=range] { width: 100%; accent-color: var(--accent) }
.blk { display: flex; flex-direction: column; gap: 8px }
.blk h4 { margin: 6px 0 0; font-size: 14px; color: var(--muted); font-weight: 500; display: flex; justify-content: space-between; align-items: center }
.srow { display: flex; align-items: center; gap: 10px; background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 14px }
.srow .grow { flex: 1; min-width: 0 }
.srow small { color: var(--muted); display: block; font-size: 12px }
.ck { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 15px }
.ck:first-of-type { border-top: 0 }
.ck input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); flex: none }
.ck span { flex: 1; min-width: 0; overflow-wrap: anywhere }
.ck.on span { color: var(--muted); text-decoration: line-through }
.ck .x { color: var(--muted); font-size: 18px; width: 30px; height: 30px }
.add-item { display: flex; gap: 8px }
.add-item input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; font-size: 16px }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--chip); border-radius: 10px; padding: 3px; gap: 3px }
.seg button { padding: 8px 0; border-radius: 8px; font-size: 15px; color: var(--muted) }
.seg button[aria-checked="true"] { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08) }
.stage { display: flex; flex-direction: column; gap: 2px; background: var(--bg); border-radius: 10px; padding: 8px 12px 4px }
.stage-h { display: flex; justify-content: space-between; font-size: 15px }
.stage-h b { font-variant-numeric: tabular-nums }
.log { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 4px }
.mini { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 10px; padding: 12px 14px; text-align: left; width: 100%; font-size: 14px }
.mini .grow { flex: 1; min-width: 0 }
.mini small { color: var(--muted); display: block; font-size: 12px }

@media (prefers-reduced-motion: reduce) { .card, .sec-h svg { transition: none } }
</style>
</head>
<body>
<div class="app">
  <div class="top gutter">
    <div class="bar">
      <h1 id="viewTitle">任務</h1>
      <button class="ibtn" id="searchBtn" aria-label="搜尋"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    </div>
    <div class="search" id="searchBox" hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="text" id="q" placeholder="搜尋任務" autocomplete="off">
    </div>
    <nav class="chips" id="chips" aria-label="分類"></nav>
  </div>
  <main class="gutter" id="main"></main>
</div>

<button class="fab" id="fab" aria-label="新增任務"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<nav class="tabbar"><div class="in">
  <button data-tab="tasks" aria-current="page"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 10h8M8 14h5" stroke-linecap="round"/></svg>任務</button>
  <button data-tab="post"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 14h4M7 10h10"/><path d="M14 14h3"/></svg>計畫</button>
  <button data-tab="prep"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 9h3l2-3h6l2 3h3v10H4z"/><circle cx="12" cy="13.5" r="3.2"/></svg>前置</button>
  <button data-tab="cal"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4" stroke-linecap="round"/></svg>日曆</button>
  <button data-tab="me"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 14a4 4 0 0 0 7 0" stroke-linecap="round"/><path d="M9.5 10h.01M14.5 10h.01" stroke-linecap="round" stroke-width="2.6"/></svg>我的</button>
</div></nav>

<div id="sheetRoot"></div>
<div id="toastRoot"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const uid = () => Math.random().toString(36).slice(2, 10);
  const pad = n => String(n).padStart(2, "0");
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const LS_KEY = "dakou-memo-v1";
  const ALL = "__all";
  const SWIPE_W = 216;

  const ICON = {
    cal: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4M12 13v5M9.5 15.5h5"/></svg>',
    chev: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m6 15 6-6 6 6"/></svg>',
    left: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg>',
    right: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>',
    star: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
    clock: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
    trash: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  };

  let state;   // {lists:[{id,name}], tasks:[{id,listId,title,date,time,mins,alarm,star,done,doneAt,calAdded,calStale,created}], active, swipeHintSeen}
  let ui = { tab: "tasks", q: "", fold: {}, showAllDone: false, sheet: null, confirm: false, calMonth: null, calSel: null, editingList: null, confirmList: null, subOpen: {} };

  // ---------- dates ----------
  const now = () => new Date();
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const todayStr = () => ymd(now());
  const addDays = n => { const d = now(); d.setDate(d.getDate() + n); return ymd(d); };
  const WD = "日一二三四五六";
  const fmtDate = s => { const [y, m, d] = s.split("-"); return +y === now().getFullYear() ? `${+m}/${+d}` : `${y}/${+m}/${+d}`; };
  function whenText(t) {
    if (!t.date) return "";
    const d = t.date === todayStr() ? "今天" : t.date === addDays(1) ? "明天" : fmtDate(t.date);
    return d + (t.time ? " " + t.time : "");
  }

  // ---------- storage (this phone only) ----------
  function fresh() {
    return { lists: [{ id: uid(), name: "個人" }, { id: uid(), name: "工作" }, { id: uid(), name: "要買什麼" }], tasks: [], active: ALL };
  }
  function load() { try { const s = JSON.parse(localStorage.getItem(LS_KEY)); if (s && s.lists) return s; } catch (e) {} return null; }
  function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { toast("存不進去，手機空間可能不足"); } }
  function commit() { save(); render(); }

  // ---------- Apple Calendar (.ics) ----------
  const icsEsc = s => String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
  const utc = d => d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const dateOnly = s => s.replace(/-/g, "");
  // ev: {uid, title, desc, date, time?, mins?, trigger?}  — no time means an all-day event
  function icsDoc(events) {
    const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//DakouMemo//ZH-TW", "CALSCALE:GREGORIAN", "METHOD:PUBLISH"];
    events.forEach((ev, i) => {
      L.push("BEGIN:VEVENT", `UID:${ev.uid}-${Date.now()}-${i}@dakou-memo`, `DTSTAMP:${utc(new Date())}`);
      if (ev.time) {
        const s = new Date(`${ev.date}T${ev.time}:00`), e = new Date(s.getTime() + (ev.mins || 30) * 60000);
        L.push(`DTSTART:${utc(s)}`, `DTEND:${utc(e)}`);
      } else {
        const e = new Date(ev.date + "T00:00:00"); e.setDate(e.getDate() + 1);
        L.push(`DTSTART;VALUE=DATE:${dateOnly(ev.date)}`, `DTEND;VALUE=DATE:${dateOnly(ymd(e))}`);
      }
      L.push(`SUMMARY:${icsEsc(ev.title)}`, `DESCRIPTION:${icsEsc(ev.desc || "")}`);
      if (ev.trigger) L.push("BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${icsEsc(ev.title)}`, `TRIGGER:${ev.trigger}`, "END:VALARM");
      L.push("END:VEVENT");
    });
    L.push("END:VCALENDAR");
    return L.join("\r\n") + "\r\n";
  }
  function buildIcs(t) {
    const list = state.lists.find(l => l.id === t.listId);
    return icsDoc([{ uid: t.id, title: t.title, desc: "打勾備忘錄・" + (list ? list.name : ""), date: t.date || todayStr(), time: t.time, mins: t.mins, trigger: alarmTrigger(t) }]);
  }
  const ALARMS_TIMED = [["0", "準時"], ["-PT5M", "5 分鐘前"], ["-PT15M", "15 分鐘前"], ["-PT1H", "1 小時前"], ["-P1D", "1 天前"], ["none", "不提醒"]];
  const ALARMS_DAY = [["PT9H", "當天早上 9:00"], ["-PT15H", "前一天早上 9:00"], ["-PT4H", "前一天晚上 8:00"], ["none", "不提醒"]];
  function alarmTrigger(t) {
    const a = t.alarm || (t.time ? "-PT15M" : "PT9H");
    if (a === "none") return "";
    if (a === "0") return "PT0S";
    const ok = (t.time ? ALARMS_TIMED : ALARMS_DAY).some(x => x[0] === a);
    return ok ? a : (t.time ? "-PT15M" : "PT9H");
  }
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  function openIcs(ics, name) {
    const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    // iPhone/iPad: opening the .ics shows the「加入行事曆」sheet. Elsewhere: save the file.
    if (!isIOS) a.download = (name.slice(0, 30) || "event") + ".ics";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }
  function addToAppleCalendar(t) {
    openIcs(buildIcs(t), t.title);
    t.calAdded = true; t.calStale = false;
    save(); render();
    toast(isIOS ? "按「加入行事曆」就完成了" : "已下載 .ics，打開它就能加入行事曆");
  }

  // ---------- 後製 (post-production projects) ----------
  const dayDiff = s => Math.round((new Date(s + "T00:00:00") - new Date(todayStr() + "T00:00:00")) / 864e5);
  function dueText(s) {
    if (!s) return "沒設截止日";
    const n = dayDiff(s);
    return n > 1 ? `剩 ${n} 天` : n === 1 ? "明天截止" : n === 0 ? "今天截止" : `超過 ${-n} 天`;
  }
  const dueWarn = s => s && dayDiff(s) <= 3;
  // % needed per day to finish on time, counting today as a work day
  function pace(p) {
    if (!p.due || p.progress >= 100) return null;
    const days = Math.max(1, dayDiff(p.due) + 1);
    return Math.ceil((100 - p.progress) / days);
  }
  const project = id => state.projects.find(p => p.id === id);
  const sessionEnd = s => new Date(`${s.date}T${s.end}:00`);
  const sessionMins = s => Math.max(15, Math.round((sessionEnd(s) - new Date(`${s.date}T${s.start}:00`)) / 60000));
  // time put in = sessions you reported on
  const hoursIn = p => (p.sessions || []).filter(s => s.reported).reduce((n, s) => n + sessionMins(s), 0) / 60;
  const fmtHours = h => h >= 10 ? Math.round(h) + " 小時" : (Math.round(h * 2) / 2) + " 小時";
  function pendingReports() {
    const out = [], t = Date.now();
    state.projects.forEach(p => (p.sessions || []).forEach(s => { if (!s.reported && sessionEnd(s).getTime() <= t) out.push({ p, s }); }));
    return out.sort((a, b) => sessionEnd(a.s) - sessionEnd(b.s));
  }
  function addSessionToCalendar(p, s) {
    const desc = `這段時間要做到 ${s.target}%（現在 ${p.progress}%）・${dueText(p.due)}${p.due ? "（" + fmtDate(p.due) + " " + typeOf(p).verb + "）" : ""}`;
    openIcs(icsDoc([
      { uid: s.id + "-work", title: `${typeOf(p).label}：${p.name}（目標 ${s.target}%）`, desc, date: s.date, time: s.start, mins: sessionMins(s), trigger: "-PT10M" },
      { uid: s.id + "-report", title: `回報進度：${p.name}`, desc: "打開打勾備忘錄 › 計畫，回報這次做到幾 %", date: s.date, time: s.end, mins: 10, trigger: "PT0S" },
    ]), p.name);
    s.calAdded = true; save(); render();
    toast(isIOS ? "按「全部加入」，工作和回報提醒都會進行事曆" : "已下載 .ics，打開它就能加入行事曆");
  }
  function setProgress(p, to, note, sid, stage) {
    to = Math.max(0, Math.min(100, Math.round(to)));
    const from = p.progress;
    if (to === from && !note) return;
    p.log = p.log || [];
    const last = p.log[p.log.length - 1];
    // merge quick taps / slider drags on the same stage within 10 minutes into one history line
    const mergeable = !sid && last && !last.sid && Date.now() - last.at < 600000 &&
      (stage ? last.stage === stage : !note && !last.note && !last.stage);
    if (mergeable) { last.to = to; last.at = Date.now(); if (stage) last.note = note; }
    else p.log.push({ at: Date.now(), from, to, note: note || "", sid: sid || null, stage: stage || null });
    p.progress = to;
    if (to >= 100 && from < 100) p.doneAt = Date.now();
    if (to < 100) p.doneAt = null;
  }

  // stages (粗剪 / 調色 / 字幕 …): each 0–100, the project's % is their average
  // a plan is anything with a deadline and a % to fill: 後製, 讀書, 學習 …
  const TYPES = {
    post:  { label: "後製", due: "交片日", verb: "交片", ph: "例如：婚紗 MV 剪輯", client: "客戶或劇組", stages: ["粗剪", "精剪", "調色", "字幕", "混音", "特效", "輸出交片"] },
    study: { label: "讀書", due: "考試日", verb: "考試", ph: "例如：影視概論期中考", client: "科目或老師", stages: ["第 1 章", "第 2 章", "第 3 章", "第 4 章", "整理筆記", "寫考古題", "總複習"] },
    learn: { label: "學習", due: "目標日", verb: "目標日", ph: "例如：學 DaVinci 調色", client: "課程或教材", stages: ["看教學", "跟著練", "做一個小作品", "找人給意見"] },
    other: { label: "其他", due: "截止日", verb: "截止", ph: "例如：更新作品集網站", client: "跟誰有關", stages: [] },
  };
  const typeOf = p => TYPES[p.type] || TYPES.post;
  const hasStages = p => p.stages && p.stages.length > 0;
  const stageAvg = list => list.length ? Math.round(list.reduce((n, s) => n + s.pct, 0) / list.length) : 0;
  function setStage(p, stId, pct) {
    const st = p.stages.find(s => s.id === stId);
    if (!st || st.pct === pct) return;
    st.pct = pct;
    setProgress(p, stageAvg(p.stages), `${st.name} ${pct}%`, null, st.id);
  }

  // ---------- 前置 (pre-production) ----------
  const CATS = [["gear", "要帶的器材", "新增器材"], ["skill", "要精進的", "新增要練的技巧"], ["todo", "要準備的", "新增準備事項"]];
  const DEFAULT_KIT = ["Fujifilm X-T3 機身", "NP-W126S 電池 ×3", "SD 記憶卡（已清空）", "充電器", "鏡頭布、吹球"];
  const prep = id => state.preps.find(x => x.id === id);
  function addPrepToCalendar(x) {
    const left = x.items.filter(i => !i.done);
    const gear = left.filter(i => i.cat === "gear").map(i => i.text);
    const desc = [x.role && "角色：" + x.role, x.place && "地點：" + x.place, gear.length ? "還沒準備的器材：" + gear.join("、") : "器材都準備好了", x.note].filter(Boolean).join("\n");
    openIcs(icsDoc([{ uid: x.id, title: `${x.kind}：${x.name}`, desc, date: x.date || todayStr(), time: x.time, mins: x.mins || 240, trigger: x.time ? "-P1D" : "-PT4H" }]), x.name);
    x.calAdded = true; save(); render();
    toast(isIOS ? "按「加入行事曆」，前一天會提醒你" : "已下載 .ics，打開它就能加入行事曆");
  }

  // ---------- toast ----------
  let toastTimer;
  function toast(msg, action) {
    const r = $("#toastRoot");
    r.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${action ? `<button id="toastAct">${esc(action.label)}</button>` : ""}</div>`;
    if (action) $("#toastAct").onclick = () => { r.innerHTML = ""; action.run(); };
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { r.innerHTML = ""; }, action ? 4500 : 2400);
  }

  // ---------- render ----------
  function renderChips() {
    const items = [{ id: ALL, name: "所有" }, ...state.lists];
    $("#chips").innerHTML = items.map(l => `<button class="chip" data-chip="${l.id}" aria-pressed="${state.active === l.id}">${esc(l.name)}</button>`).join("")
      + `<button class="chip more" data-goto="me" aria-label="管理分類">＋</button>`;
  }

  function cardHtml(t) {
    const list = state.lists.find(l => l.id === t.listId);
    const late = !t.done && t.date && t.date < todayStr();
    const w = whenText(t);
    const subs = t.subs || [], subDone = subs.filter(s => s.done).length, subOpen = subs.length && ui.subOpen[t.id];
    const meta = [
      w ? `<span class="${late ? "late" : ""}">${w}</span>` : "",
      state.active === ALL && list ? `<span class="cat">${esc(list.name)}</span>` : "",
      t.calAdded && !t.done ? `<span class="on-cal">${t.calStale ? "時間改了，行事曆要再加一次" : "已加行事曆"}</span>` : ""
    ].join("");
    return `<div class="swipe" data-row="${t.id}">
      <div class="swipe-acts" aria-hidden="true">
        <button class="a-star" data-star="${t.id}" tabindex="-1">${ICON.star}${t.star ? "取消星號" : "星號"}</button>
        <button class="a-snooze" data-snooze="${t.id}" tabindex="-1">${ICON.clock}延遲</button>
        <button class="a-del" data-del="${t.id}" tabindex="-1">${ICON.trash}刪除</button>
      </div>
      <div class="card ${t.done ? "done" : ""}" data-card="${t.id}">
        <button class="tick" data-tick="${t.id}" aria-label="${t.done ? "取消完成" : "完成"}：${esc(t.title)}"><span></span></button>
        <button class="body" data-open="${t.id}"><span class="title">${t.star ? '<span class="st" aria-label="星號">★</span>' : ""}<span>${esc(t.title)}</span></span>${meta ? `<span class="meta">${meta}</span>` : ""}</button>
        <div class="acts">${subs.length ? `<button class="subtog" data-subtog="${t.id}" aria-expanded="${!!subOpen}" aria-label="子項目 ${subDone}/${subs.length}">${subDone}/${subs.length} ${subOpen ? "▴" : "▾"}</button>` : ""}${t.done ? "" : `<button class="ibtn" data-cal="${t.id}" aria-label="加到行事曆">${ICON.cal}</button>`}</div>
        ${subOpen ? `<div class="subs">${subs.map(s => `<label class="ck ${s.done ? "on" : ""}"><input type="checkbox" data-sub="${t.id}|${s.id}" ${s.done ? "checked" : ""}><span>${esc(s.text)}</span></label>`).join("")}
          <form class="add-item" data-addsub="${t.id}"><input type="text" placeholder="再加一項" maxlength="60" autocomplete="off"><button class="txt-btn" type="submit">加入</button></form></div>` : ""}
      </div>

  }

  function section(key, label, list) {
    if (!list.length) return "";

      ${open ? `<div class="cards">${list.map(cardHtml).join("")}</div>` : ""}`;
  }

  const byWhen = (a, b) => (b.star ? 1 : 0) - (a.star ? 1 : 0) ||
    ((a.date || "9") + (a.time || "99")).localeCompare((b.date || "9") + (b.time || "99")) || a.created - b.created;

  function renderTasks() {
    const q = ui.q.trim().toLowerCase(), today = todayStr();
    let tasks = state.tasks.filter(t => state.active === ALL || t.listId === state.active);
    if (q) tasks = tasks.filter(t => t.title.toLowerCase().includes(q));
    const open = tasks.filter(t => !t.done).sort(byWhen);
    const done = tasks.filter(t => t.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));

  function renderCal() {
    const today = todayStr();
    const base = ui.calMonth || today.slice(0, 7);
    const [y, m] = base.split("-").map(Number);
    const first = new Date(y, m - 1, 1), start = new Date(first); start.setDate(1 - first.getDay());
    const sel = ui.calSel || today;
    const inList = t => state.active === ALL || t.listId === state.active;
    const hasTask = new Set(state.tasks.filter(t => t.date && !t.done && inList(t)).map(t => t.date));
    state.projects.forEach(p => {
      if (p.due && p.progress < 100) hasTask.add(p.due);
      (p.sessions || []).forEach(s => { if (!s.reported) hasTask.add(s.date); });
    });
    state.preps.forEach(x => { if (x.date) hasTask.add(x.date); });
    let cells = "";
    for (let i = 0; i < 42; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i);

    }

  }

  function renderMe() {
    const rows = state.lists.map(l => {
      const n = state.tasks.filter(t => t.listId === l.id && !t.done).length;
      if (ui.editingList === l.id) return `<form class="row" data-renameform="${l.id}"><span class="grow"><input type="text" id="rn-${l.id}" value="${esc(l.name)}" maxlength="12"></span><button class="txt-btn" type="submit">完成</button></form>`;

    const openAll = state.tasks.filter(t => !t.done).length, doneAll = state.tasks.length - openAll;
    const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
    return `<div class="panel">
        <h2>分類</h2>${rows}
        <form class="row" id="newListForm"><span class="grow"><input type="text" id="newListName" placeholder="新分類，例如：攝影案" maxlength="12"></span><button class="txt-btn" type="submit">新增</button></form>
      </div>
      <div class="panel">
        <h2>統計</h2>
        <div class="row"><span class="grow">還沒做</span><b>${openAll}</b></div>
        <div class="row"><span class="grow">做完了</span><b>${doneAll}</b></div>
      </div>
      <div class="panel">
        <h2>資料</h2>
        <p class="note">任務只存在這支手機的這個 App 裡，不會上傳。換手機或清除 Safari 資料前，記得先匯出備份。${standalone ? "" : "<br>建議用 Safari 的「分享 › 加入主畫面」安裝，資料比較不會被系統清掉。"}</p>
        <div class="row"><span class="grow">匯出備份（.json）</span><button class="txt-btn" data-export="1">匯出</button></div>
        <div class="row"><span class="grow">從備份還原（會取代現在的資料）</span><button class="txt-btn" data-import="1">匯入</button></div>
      </div>
      <div class="panel">
        <h2>蘋果行事曆</h2>
        <p class="note">按任務右邊的日曆圖示，會跳出 iPhone 的「加入行事曆」畫面，再按一次「加入」就會出現在內建行事曆，並照你設定的時間提醒。<br>
        之後在這裡改時間或延遲，行事曆裡的舊活動不會跟著改，要再加一次，再到行事曆把舊的刪掉。</p>
      </div>`;
  }

  // ---------- 後製 tab ----------
  const md = s => `${+s.slice(5, 7)}/${+s.slice(8)}`;
  function reportBanner(reps) {
    if (!reps.length) return "";
    return `<div class="banner"><b>有 ${reps.length} 個工作時段還沒回報進度</b>${reps.map(({ p, s }) =>
      `<button data-report="${p.id}|${s.id}"><span>${esc(p.name)}・${md(s.date)} ${s.start}–${s.end}</span><span>回報 ›</span></button>`).join("")}</div>`;
  }
  function pcard(p) {
    const pc = pace(p), done = p.progress >= 100;
    const sess = p.sessions || [];
    const pend = sess.filter(s => !s.reported && sessionEnd(s) <= Date.now()).length;
    const today = sess.find(s => s.date === todayStr() && !s.reported && sessionEnd(s) > Date.now());
    const right = pend ? `<span class="badge">待回報</span>` : today ? `今天 ${today.start} 做到 ${today.target}%` : pc ? `每天要做約 ${pc}%` : "";
    return `<button class="pcard" data-proj="${p.id}">
      <div class="pcard-h"><b><span class="kind">${typeOf(p).label}</span> ${esc(p.name)}</b><span class="pct">${p.progress}%</span></div>
      <div class="pbar ${done ? "full" : ""}"><i style="width:${p.progress}%"></i></div>
      ${hasStages(p) ? `<div class="pmeta" style="justify-content:flex-start;gap:4px 12px">${p.stages.map(st => `<span>${esc(st.name)} <b style="color:${st.pct >= 100 ? "var(--ok)" : "var(--ink)"}">${st.pct}%</b></span>`).join("")}</div>` : ""}
      <div class="pmeta"><span>${p.client ? esc(p.client) + "・" : ""}<span class="due ${!done && dueWarn(p.due) ? "warn" : ""}">${done ? "已完成" : dueText(p.due)}</span></span><span>${right}</span></div>
    </button>`;
  }
  function renderPost() {
    const reps = pendingReports();
    if (!state.projects.length) return `<div class="empty">還沒有計畫。按右下角的 ＋ 新增：後製案子、考試讀書、想學的技能都可以，設好期限就會算出每天要做多少。
      <button class="ghost" data-sample-post="1">先載入範例看看</button></div>`;
    const ft = ui.planType || "all";
    const used = Object.keys(TYPES).filter(k => state.projects.some(p => (p.type || "post") === k));
    const filters = used.length > 1 ? `<nav class="chips" aria-label="計畫類型" style="padding-top:4px">${[["all", "全部"], ...used.map(k => [k, TYPES[k].label])].map(([k, n]) =>
      `<button class="chip" data-planfilter="${k}" aria-pressed="${ft === k}">${n}</button>`).join("")}</nav>` : "";
    const sorted = state.projects.filter(p => ft === "all" || (p.type || "post") === ft).sort((a, b) => (a.due || "9").localeCompare(b.due || "9"));
    const open = sorted.filter(p => p.progress < 100), done = sorted.filter(p => p.progress >= 100);
    return reportBanner(reps) + filters +
      (open.length ? `<div class="sec-h">進行中<span class="n">${open.length}</span></div><div class="cards">${open.map(pcard).join("")}</div>` : `<div class="empty">這裡的計畫都完成了。</div>`) +
      (done.length ? `<button class="sec-h" data-fold="postDone" aria-expanded="${!ui.fold.postDone}">已完成<span class="n">${done.length}</span>${ICON.chev}</button>${ui.fold.postDone ? "" : `<div class="cards">${done.map(pcard).join("")}</div>`}` : "");
  }

  // ---------- 前置 tab ----------
  function prepWhen(x) {
    if (!x.date) return { text: "還沒定日期", warn: false };
    const n = dayDiff(x.date);
    return { text: n === 0 ? "今天" : n === 1 ? "明天" : n > 0 ? `剩 ${n} 天` : `${-n} 天前`, warn: n >= 0 && n <= 2 };
  }
  function prepCard(x) {
    const w = prepWhen(x);
    const gear = x.items.filter(i => i.cat === "gear"), gDone = gear.filter(i => i.done).length;
    const left = x.items.filter(i => !i.done).length;
    const status = !x.items.length ? "還沒列清單" : left ? `還有 ${left} 項沒準備` : "都準備好了";
    return `<button class="pcard" data-prepopen="${x.id}">
      <div class="pcard-h"><b>${esc(x.name)}</b><span class="due ${w.warn ? "warn" : ""}">${w.text}</span></div>
      <div class="pmeta"><span><span class="kind">${esc(x.kind)}</span> ${x.date ? fmtDate(x.date) + (x.time ? " " + x.time : "") : ""}${x.role ? "・" + esc(x.role) : ""}</span>
      <span>${gear.length ? `器材 ${gDone}/${gear.length}・` : ""}${status}</span></div>
    </button>`;
  }
  function renderPrep() {
    const sorted = state.preps.slice().sort((a, b) => (a.date || "9").localeCompare(b.date || "9"));
    const up = sorted.filter(x => !x.date || dayDiff(x.date) >= 0), past = sorted.filter(x => x.date && dayDiff(x.date) < 0).reverse();
    if (!sorted.length) return `<div class="empty">還沒有接下來的工作。按右下角的 ＋ 新增劇組或案子，列出要帶的器材和要練的技巧。
      <button class="ghost" data-sample-prep="1">先載入範例看看</button></div>`;
    const pastOpen = !ui.fold.prepPast;
    return (up.length ? `<div class="sec-h">接下來<span class="n">${up.length}</span></div><div class="cards">${up.map(prepCard).join("")}</div>` : `<div class="empty">接下來沒有排定的工作。</div>`) +
      (past.length ? `<button class="sec-h" data-fold="prepPast" aria-expanded="${pastOpen}">已經過了<span class="n">${past.length}</span>${ICON.chev}</button>${pastOpen ? `<div class="cards">${past.map(prepCard).join("")}</div>` : ""}` : "");
  }

  // ---------- sheets for 後製 / 前置 ----------
  function projSheet(p) {
    const pc = pace(p), n = p.due ? dayDiff(p.due) : null;
    const sess = (p.sessions || []).slice().sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
    const reps = sess.filter(s => !s.reported && sessionEnd(s) <= Date.now()).map(s => ({ p, s }));
    const upcoming = sess.filter(s => !s.reported && sessionEnd(s) > Date.now());
    const log = (p.log || []).slice().reverse().slice(0, 12);
    const sessRow = s => `<div class="srow"><span class="grow">${md(s.date)}（${WD[new Date(s.date + "T00:00:00").getDay()]}）${s.start}–${s.end}<small>目標做到 ${s.target}%</small></span>
      ${s.calAdded ? `<small style="color:var(--accent)">已加行事曆</small>` : `<button class="txt-btn" data-sesscal="${p.id}|${s.id}">加到行事曆</button>`}
      <button class="ibtn" style="width:30px;height:30px;color:var(--muted)" data-sessdel="${p.id}|${s.id}" aria-label="刪除這個時段">×</button></div>`;
    return `<div class="sheet gutter" role="dialog" aria-label="${esc(p.name)}">
      <span class="grab"></span>
      <div class="pcard-h"><h3>${esc(p.name)}</h3><button class="txt-btn" data-editproj="${p.id}">編輯</button></div>
      <p class="sub">${p.client ? esc(p.client) + "・" : ""}${p.due ? fmtDate(p.due) + " " + typeOf(p).verb : "沒設" + typeOf(p).due}</p>
      <div class="big"><b id="pctNow">${p.progress}%</b><span>${p.progress >= 100 ? "已完成" : dueText(p.due)}</span></div>
      <div class="pbar ${p.progress >= 100 ? "full" : ""}"><i id="pctBar" style="width:${p.progress}%"></i></div>
      ${hasStages(p) ? `<div class="blk"><h4>各階段進度<span class="n">拖曳調整，總進度自動算</span></h4>
        ${p.stages.map(st => `<div class="stage"><div class="stage-h"><span>${esc(st.name)}</span><b id="sv-${st.id}">${st.pct}%</b></div>
          <input type="range" data-stage="${st.id}" min="0" max="100" step="5" value="${st.pct}" aria-label="${esc(st.name)} 進度"></div>`).join("")}</div>`
      : `<label class="field">拖曳調整進度<input type="range" id="pSlider" min="0" max="100" step="5" value="${p.progress}"></label>
      <div class="quick"><button type="button" data-padd="-5">−5%</button><button type="button" data-padd="5">+5%</button><button type="button" data-padd="10">+10%</button><button type="button" data-padd="100">完成 100%</button></div>
      <p class="note" style="padding:0">想分成粗剪、調色、字幕分別拉？按右上角「編輯」加階段。</p>`}
      <div class="stats">
        <div><small>還剩</small><b>${100 - p.progress}%</b></div>
        <div><small>${n === null ? "截止日" : n >= 0 ? "剩幾天" : "超過"}</small><b>${n === null ? "—" : Math.abs(n) + " 天"}</b></div>
        <div><small>每天要做</small><b>${pc ? pc + "%" : "—"}</b></div>
      </div>
      ${hoursIn(p) ? `<p class="note" style="padding:0">已經投入 ${fmtHours(hoursIn(p))}（${(p.sessions || []).filter(s => s.reported).length} 次回報）</p>` : ""}
      ${reportBanner(reps)}
      ${p.progress < 100 ? `<div class="blk"><h4>排定的工作<button class="txt-btn" data-newsession="${p.id}">＋ 安排工作</button></h4>
        ${upcoming.length ? upcoming.map(sessRow).join("") : `<p class="note" style="padding:0">還沒排。安排一段時間，行事曆會提醒你那天要做到幾 %，結束時再提醒你回報。</p>`}</div>` : ""}
      ${log.length ? `<div class="blk"><h4>進度紀錄</h4><div class="log">${log.map(l => {
        const d = new Date(l.at);
        return `<span>${d.getMonth() + 1}/${d.getDate()} ${hm(d)}　${l.from}% → <b style="color:var(--ink)">${l.to}%</b>${l.note ? "　" + esc(l.note) : ""}</span>`;
      }).join("")}</div></div>` : ""}
      <button type="button" class="btn sec" data-close="1">關閉</button>
      ${ui.confirm ? `<div class="confirm"><span style="flex:1">確定刪除「${esc(p.name)}」和所有紀錄？</span><button class="txt-btn danger" data-delprojyes="${p.id}">刪除</button><button class="txt-btn" data-delno="1">取消</button></div>`
        : `<button class="txt-btn danger" data-delask="1" style="align-self:center">刪除計畫</button>`}
    </div>`;
  }
  function projForm(s) {
    const d = s.draft, T = TYPES[d.type] || TYPES.post;
    return `<form class="sheet gutter" id="projForm" role="dialog" aria-label="${s.isNew ? "新增計畫" : "編輯計畫"}">
      <span class="grab"></span><h3>${s.isNew ? "新增計畫" : "編輯計畫"}</h3>
      <div class="seg" role="radiogroup" aria-label="類型">${Object.entries(TYPES).map(([k, t]) => `<button type="button" role="radio" aria-checked="${k === d.type}" data-ptype="${k}">${t.label}</button>`).join("")}</div>
      <label class="field">名稱<input type="text" id="pName" value="${esc(d.name)}" maxlength="60" placeholder="${T.ph}" autocomplete="off"></label>
      <label class="field">${T.client}（可不填）<input type="text" id="pClient" value="${esc(d.client)}" maxlength="40" autocomplete="off"></label>
      <div class="two">
        <label class="field">${T.due}<input type="date" id="pDue" value="${d.due}"></label>
        ${d.stages.length ? `<div class="field">目前進度<b style="color:var(--ink);font-size:20px;padding:8px 0">${stageAvg(d.stages)}%</b></div>`
          : `<label class="field">目前進度 %<input type="number" id="pProg" min="0" max="100" step="5" value="${d.progress}" inputmode="numeric"></label>`}
      </div>
      <div class="blk"><h4>${T.label}階段<span class="n">${d.stages.length ? "每個階段 0–100%，總進度取平均" : "可不填，這次要做哪些就加哪些"}</span></h4>
        <div>${d.stages.map((st, i) => `<div class="ck"><span>${esc(st.name)}${st.pct ? `<small style="color:var(--muted)">　${st.pct}%</small>` : ""}</span>
          ${i > 0 ? `<button type="button" class="x" data-stageup="${i}" aria-label="往上移">↑</button>` : ""}<button type="button" class="x" data-stagerm="${i}" aria-label="移除">×</button></div>`).join("")}</div>
        <div class="quick">${T.stages.filter(n => !d.stages.some(st => st.name === n)).map(n => `<button type="button" data-stagesug="${n}">＋ ${n}</button>`).join("")}</div>
        <div class="add-item"><input type="text" id="pStage" placeholder="自己取名，例如：調音、上字卡" maxlength="16" autocomplete="off" enterkeyhint="done"><button class="txt-btn" type="button" data-stageadd="1">加入</button></div>
      </div>
      <div class="btns"><button type="button" class="btn sec" data-${s.isNew ? "close" : "backproj"}="${s.id || 1}">取消</button><button type="submit" class="btn pri">儲存</button></div>
    </form>`;
  }
  function sessionForm(s) {
    const p = project(s.pid), d = s.draft;
    return `<form class="sheet gutter" id="sessForm" role="dialog" aria-label="安排工作">
      <span class="grab"></span><h3>安排工作</h3><p class="sub">${esc(p.name)}・現在 ${p.progress}%・${dueText(p.due)}</p>
      <label class="field">哪一天<input type="date" id="sDate" value="${d.date}"></label>
      <div class="two"><label class="field">開始<input type="time" id="sStart" value="${d.start}"></label><label class="field">結束<input type="time" id="sEnd" value="${d.end}"></label></div>
      <label class="field">這段時間要做到 <b id="sTargetVal" style="color:var(--ink)">${d.target}%</b><input type="range" id="sTarget" min="${p.progress}" max="100" step="5" value="${d.target}"></label>
      ${pace(p) ? `<p class="note" style="padding:0">照截止日算，每天要做約 ${pace(p)}%。</p>` : ""}
      <label class="switch"><span>同時加到蘋果行事曆<small>會加兩個活動：工作時段，和結束時的「回報進度」提醒</small></span><input type="checkbox" id="sCal" ${d.cal ? "checked" : ""}></label>
      <div class="btns"><button type="button" class="btn sec" data-backproj="${p.id}">取消</button><button type="submit" class="btn pri">儲存</button></div>
    </form>`;
  }
  function reportForm(s) {
    const p = project(s.pid), ss = p.sessions.find(x => x.id === s.sid);
    return `<form class="sheet gutter" id="reportForm" role="dialog" aria-label="回報進度">
      <span class="grab"></span><h3>回報今天的進度</h3>
      <p class="sub">${esc(p.name)}・${md(ss.date)} ${ss.start}–${ss.end}・原本 ${p.progress}%，目標 ${ss.target}%</p>
      <div class="big"><b id="rVal">${s.value}%</b><span>實際做到</span></div>
      ${s.stageVals ? `<div class="blk">${p.stages.map(st => `<div class="stage"><div class="stage-h"><span>${esc(st.name)}</span><b id="rv-${st.id}">${s.stageVals[st.id]}%</b></div>
          <input type="range" data-rstage="${st.id}" min="0" max="100" step="5" value="${s.stageVals[st.id]}" aria-label="${esc(st.name)} 做到幾 %"></div>`).join("")}</div>` : `
      <input type="range" id="rSlider" min="0" max="100" step="5" value="${s.value}" aria-label="實際做到幾 %">
      <div class="quick"><button type="button" data-rq="${p.progress}">沒進度</button><button type="button" data-rq="${ss.target}">達成目標 ${ss.target}%</button><button type="button" data-rq="100">全部完成</button></div>`}
      <label class="field">備註（可不填）<input type="text" id="rNote" maxlength="80" placeholder="例如：調色卡在第三段" autocomplete="off"></label>
      <div class="btns"><button type="button" class="btn sec" data-close="1">晚點再說</button><button type="submit" class="btn pri">回報</button></div>
    </form>`;
  }
  function prepSheet(x) {
    const w = prepWhen(x);
    const group = ([cat, label, ph]) => {
      const items = x.items.filter(i => i.cat === cat);
      return `<div class="blk"><h4>${label}<span class="n">${items.filter(i => i.done).length}/${items.length}</span></h4>
        <div>${items.map(i => `<label class="ck ${i.done ? "on" : ""}"><input type="checkbox" data-item="${x.id}|${i.id}" ${i.done ? "checked" : ""}><span>${esc(i.text)}</span><button type="button" class="x" data-itemdel="${x.id}|${i.id}" aria-label="刪除">×</button></label>`).join("")}</div>
        <form class="add-item" data-additem="${cat}"><input type="text" placeholder="${ph}" maxlength="60" autocomplete="off"><button class="txt-btn" type="submit">加入</button></form>
        ${cat === "gear" ? `<div class="quick"><button type="button" data-kit="${x.id}">帶入常用器材</button>${items.length ? `<button type="button" data-savekit="${x.id}">把這些存成常用器材</button>` : ""}</div>` : ""}
      </div>`;
    };
    return `<div class="sheet gutter" role="dialog" aria-label="${esc(x.name)}">
      <span class="grab"></span>
      <div class="pcard-h"><h3>${esc(x.name)}</h3><button class="txt-btn" data-prepedit="${x.id}">編輯</button></div>
      <p class="sub"><span class="kind">${esc(x.kind)}</span> ${x.date ? fmtDate(x.date) + "（" + WD[new Date(x.date + "T00:00:00").getDay()] + "）" + (x.time ? " " + x.time : "") : ""}${x.place ? "・" + esc(x.place) : ""}</p>
      <div class="big"><b style="font-size:34px;color:${w.warn ? "var(--late)" : "var(--ink)"}">${w.text}</b>${x.role ? `<span>擔任 ${esc(x.role)}</span>` : ""}</div>
      ${x.note ? `<p class="note" style="padding:0">${esc(x.note)}</p>` : ""}
      ${x.date && dayDiff(x.date) >= 0 ? (x.calAdded ? `<p class="note" style="padding:0;color:var(--accent)">已加到行事曆，前一天會提醒你。</p>` : `<button type="button" class="btn cal" data-prepcal="${x.id}">加到蘋果行事曆（前一天提醒）</button>`) : ""}
      ${CATS.map(group).join("")}
      <button type="button" class="btn cal" data-topost="${x.id}">拍完了，建立後製計畫</button>
      <button type="button" class="btn sec" data-close="1">關閉</button>
      ${ui.confirm ? `<div class="confirm"><span style="flex:1">確定刪除「${esc(x.name)}」？</span><button class="txt-btn danger" data-prepdelyes="${x.id}">刪除</button><button class="txt-btn" data-delno="1">取消</button></div>`
        : `<button class="txt-btn danger" data-delask="1" style="align-self:center">刪除</button>`}
    </div>`;
  }
  function prepForm(s) {
    const d = s.draft;
    return `<form class="sheet gutter" id="prepForm" role="dialog" aria-label="${s.isNew ? "新增前置準備" : "編輯"}">
      <span class="grab"></span><h3>${s.isNew ? "新增接下來的工作" : "編輯"}</h3>
      <label class="field">劇組或案子名稱<input type="text" id="xName" value="${esc(d.name)}" maxlength="60" placeholder="例如：《夏至》畢製劇組" autocomplete="off"></label>
      <div class="two">
        <label class="field">類型<select id="xKind">${["劇組", "案子", "其他"].map(k => `<option ${k === d.kind ? "selected" : ""}>${k}</option>`).join("")}</select></label>
        <label class="field">你的角色<input type="text" id="xRole" value="${esc(d.role)}" maxlength="20" placeholder="例如：攝影助理" autocomplete="off"></label>
      </div>
      <div class="two"><label class="field">日期<input type="date" id="xDate" value="${d.date}"></label><label class="field">集合時間<input type="time" id="xTime" value="${d.time}"></label></div>
      <label class="field">地點（可不填）<input type="text" id="xPlace" value="${esc(d.place)}" maxlength="40" autocomplete="off"></label>
      <label class="field">備註（可不填）<input type="text" id="xNote" value="${esc(d.note)}" maxlength="120" autocomplete="off"></label>
      <div class="btns"><button type="button" class="btn sec" data-${s.isNew ? "close" : "prepopen"}="${s.id || 1}">取消</button><button type="submit" class="btn pri">儲存</button></div>
    </form>`;
  }

  function alarmOptions(t) {
    const list = t.time ? ALARMS_TIMED : ALARMS_DAY;
    const cur = alarmTrigger(t) === "PT0S" ? "0" : (alarmTrigger(t) || "none");
    return list.map(([v, n]) => `<option value="${v}" ${v === cur ? "selected" : ""}>${n}</option>`).join("");
  }

  function snoozeChoices() {
    const n = now(), out = [];
    const later = new Date(n.getTime() + 3600e3); later.setMinutes(later.getMinutes() < 30 ? 30 : 60, 0, 0);
    out.push(["1 小時後", ymd(later), hm(later)]);
    if (n.getHours() < 19) out.push(["今晚", ymd(n), "20:00"]);

  // ---------- swipe right to reveal 星號 / 延遲 / 刪除 ----------
  let openRow = null, drag = null, justSwiped = false;
  const setX = (card, x) => { card.style.transform = x ? `translateX(${x}px)` : ""; };
  function closeOpenRow() { if (openRow) { setX(openRow, 0); openRow = null; } }

  document.addEventListener("pointerdown", e => {
    const card = e.target.closest(".card");
    if (!card || e.button > 0) { if (!e.target.closest(".swipe-acts")) closeOpenRow(); return; }
    if (openRow && openRow !== card) closeOpenRow();
    drag = { card, x0: e.clientX, y0: e.clientY, base: card === openRow ? SWIPE_W : 0, active: false, id: e.pointerId };
  });
  document.addEventListener("pointermove", e => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if (!drag.active) {
      if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { drag = null; return; }  // vertical scroll wins
      if (Math.abs(dx) < 10) return;
      drag.active = true; drag.card.classList.add("dragging");
      try { drag.card.setPointerCapture(e.pointerId); } catch (_) {}
    }
    let x = drag.base + dx;
    if (x < 0) x = 0;
    if (x > SWIPE_W) x = SWIPE_W + (x - SWIPE_W) * .25;
    setX(drag.card, x);
  });
  function endDrag(e) {
    if (!drag || (e && e.pointerId !== drag.id)) return;
    const d = drag; drag = null;
    if (!d.active) return;
    d.card.classList.remove("dragging");
    justSwiped = true; setTimeout(() => { justSwiped = false; }, 50);
    const x = d.base + (e.clientX - d.x0);
    if (x > SWIPE_W * .4) {
      setX(d.card, SWIPE_W); openRow = d.card;
      if (!state.swipeHintSeen) { state.swipeHintSeen = true; save(); const h = $(".hint"); if (h) h.remove(); }
    } else { setX(d.card, 0); if (openRow === d.card) openRow = null; }
  }
  document.addEventListener("pointerup", endDrag);
  document.addEventListener("pointercancel", e => { if (drag && drag.active) { setX(drag.card, drag.base); drag.card.classList.remove("dragging"); } drag = null; });

  // ---------- actions ----------
  const task = id => state.tasks.find(x => x.id === id);

  function deleteTask(id) {
    const i = state.tasks.findIndex(t => t.id === id);

    toast("已刪除「" + t.title + "」", { label: "復原", run: () => { state.tasks.splice(i, 0, t); commit(); } });

  function setWhen(t, date, time) {

  document.addEventListener("click", e => {

    if (d.tab) { ui.tab = d.tab; ui.showAllDone = false; ui.editingList = ui.confirmList = null; render(); window.scrollTo(0, 0); return; }
    if (d.goto) { ui.tab = d.goto; render(); return; }

    if (el.id === "searchBtn") { const b = $("#searchBox"); b.hidden = !b.hidden; if (!b.hidden) $("#q").focus(); else { ui.q = ""; $("#q").value = ""; render(); } return; }

      if (ui.tab === "prep") { ui.sheet = { kind: "prepForm", isNew: true, draft: { name: "", kind: "劇組", role: "", date: "", time: "", place: "", note: "" } }; renderSheet(); $("#xName").focus(); return; }

    if (d.fold) { ui.fold[d.fold] = !ui.fold[d.fold]; render(); return; }
    if (d.alldone) { ui.showAllDone = true; render(); window.scrollTo(0, 0); return; }
    if (d.back) { ui.showAllDone = false; render(); return; }
    if (d.sample) { loadSample(); return; }

    if (d.tick) {

  document.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.id === "fSub" && !e.isComposing) { e.preventDefault(); addDraftSub(); }
    if (e.key === "Enter" && e.target.id === "pStage" && !e.isComposing) { e.preventDefault(); addDraftStage(); }
  });

  document.addEventListener("change", e => {
    const el = e.target, d = el.dataset;
    if (el.id === "pSlider") {
      const p = project(ui.sheet.id), before = p.progress;
      setProgress(p, +el.value); commit();
      if (p.progress >= 100 && before < 100) toast("完成了！");
      return;
    }
    if (d.stage) {
      const p = project(ui.sheet.id), before = p.progress;
      setStage(p, d.stage, +el.value); commit();
      if (p.progress >= 100 && before < 100) toast("所有階段都完成了！");
      return;
    }
    if (d.sub) {
      const [tid, sid] = d.sub.split("|"), t = task(tid), s = t.subs.find(x => x.id === sid);
      s.done = el.checked; commit();
      if (!t.done && t.subs.every(x => x.done)) toast("子項目都打勾了", { label: "完成任務", run: () => { t.done = true; t.doneAt = Date.now(); commit(); } });
      return;
    }
    if (d.item) {
      const [xid, iid] = d.item.split("|"), x = prep(xid);
      x.items.find(i => i.id === iid).done = el.checked; commit();
      if (x.items.length && x.items.every(i => i.done)) toast("全部準備好了");
    }
  });

  document.addEventListener("input", e => {
    if (e.target.id === "q") { ui.q = e.target.value; $("#main").innerHTML = renderTasks(); return; }
    if (e.target.id === "pSlider") { $("#pctNow").textContent = e.target.value + "%"; $("#pctBar").style.width = e.target.value + "%"; return; }
    if (e.target.dataset.stage) {
      const p = project(ui.sheet.id), v = +e.target.value;
      $("#sv-" + e.target.dataset.stage).textContent = v + "%";
      const avg = stageAvg(p.stages.map(st => ({ pct: st.id === e.target.dataset.stage ? v : st.pct })));
      $("#pctNow").textContent = avg + "%"; $("#pctBar").style.width = avg + "%";
      return;
    }
    if (e.target.dataset.rstage) {
      const p = project(ui.sheet.pid), id = e.target.dataset.rstage;
      ui.sheet.stageVals[id] = +e.target.value;
      $("#rv-" + id).textContent = e.target.value + "%";
      ui.sheet.value = stageAvg(p.stages.map(st => ({ pct: ui.sheet.stageVals[st.id] })));
      $("#rVal").textContent = ui.sheet.value + "%";
      return;
    }
    if (e.target.id === "sTarget") { $("#sTargetVal").textContent = e.target.value + "%"; return; }
    if (e.target.id === "rSlider") { ui.sheet.value = +e.target.value; $("#rVal").textContent = e.target.value + "%"; return; }
    // switching between timed and all-day changes which reminder options make sense
    if (e.target.id === "fTime" && ui.sheet) {
      const had = !!ui.sheet.draft.time; readForm();
      if (had !== !!ui.sheet.draft.time) { ui.sheet.draft.alarm = ""; renderSheet(); }
    }
  });

  document.addEventListener("submit", e => {
    e.preventDefault();
    const f = e.target;
    const val = id => $(id).value.trim();
    if (f.id === "projForm") {
      const name = val("#pName"); if (!name) { $("#pName").focus(); toast("先寫案子名稱"); return; }
      const stages = ui.sheet.draft.stages;
      const prog = stages.length ? stageAvg(stages) : Math.max(0, Math.min(100, Math.round(+$("#pProg").value || 0)));
      let p;
      if (ui.sheet.isNew) {
        p = { id: uid(), type: ui.sheet.draft.type, name, client: val("#pClient"), due: $("#pDue").value, progress: prog, stages, sessions: [], log: [], created: Date.now() };
        state.projects.push(p);
        if (ui.sheet.fromPrep) { const x = prep(ui.sheet.fromPrep); if (x) x.postId = p.id; }
      } else {
        p = project(ui.sheet.id);
        Object.assign(p, { type: ui.sheet.draft.type, name, client: val("#pClient"), due: $("#pDue").value, stages });
        setProgress(p, prog);
      }
      ui.sheet = { kind: "proj", id: p.id }; commit(); toast("已儲存"); return;
    }
    if (f.id === "sessForm") {
      const p = project(ui.sheet.pid);
      const s = { id: uid(), date: $("#sDate").value, start: $("#sStart").value, end: $("#sEnd").value, target: +$("#sTarget").value, reported: false, calAdded: false };
      if (!s.date || !s.start || !s.end) { toast("日期和時間都要填"); return; }
      if (s.end <= s.start) { toast("結束時間要比開始晚"); return; }
      const wantCal = $("#sCal").checked;
      p.sessions = p.sessions || []; p.sessions.push(s);
      ui.sheet = { kind: "proj", id: p.id };
      if (wantCal) { addSessionToCalendar(p, s); return; }
      commit(); toast("已安排"); return;
    }
    if (f.id === "reportForm") {
      const p = project(ui.sheet.pid), s = p.sessions.find(x => x.id === ui.sheet.sid);
      const before = p.progress, sv = ui.sheet.stageVals;
      let note = val("#rNote"), to;
      if (sv) {
        const moved = p.stages.filter(st => sv[st.id] !== st.pct).map(st => `${st.name} ${st.pct}→${sv[st.id]}%`);
        p.stages.forEach(st => { st.pct = sv[st.id]; });
        to = stageAvg(p.stages);
        note = [moved.join("、"), note].filter(Boolean).join("・");
      } else to = +$("#rSlider").value;
      setProgress(p, to, note, s.id); s.reported = true; s.result = to;
      ui.sheet = null; commit();
      toast(to >= 100 ? "完成了！" : to >= s.target ? `達成目標，現在 ${to}%` : to > before ? `進度 ${before}% → ${to}%，明天再加油` : "已記錄，今天沒進度");
      return;
    }
    if (f.id === "prepForm") {
      const name = val("#xName"); if (!name) { $("#xName").focus(); toast("先寫劇組或案子名稱"); return; }
      const fields = { name, kind: $("#xKind").value, role: val("#xRole"), date: $("#xDate").value, time: $("#xTime").value, place: val("#xPlace"), note: val("#xNote") };
      let x;
      if (ui.sheet.isNew) { x = { id: uid(), items: [], created: Date.now(), ...fields }; state.preps.push(x); }
      else { x = prep(ui.sheet.id); if (x.date !== fields.date || x.time !== fields.time) x.calAdded = false; Object.assign(x, fields); }
      ui.sheet = { kind: "prep", id: x.id }; commit(); toast("已儲存"); return;
    }
    if (f.dataset.additem) {
      const inp = $("input", f), text = inp.value.trim(); if (!text) return;
      prep(ui.sheet.id).items.push({ id: uid(), cat: f.dataset.additem, text, done: false });
      commit();
      const again = $(`[data-additem="${f.dataset.additem}"] input`); if (again) again.focus();
      return;
    }
    if (f.dataset.addsub) {
      const inp = $("input", f), text = inp.value.trim(); if (!text) return;
      const t = task(f.dataset.addsub); t.subs = t.subs || []; t.subs.push({ id: uid(), text, done: false });
      commit();
      const again = $(`[data-addsub="${t.id}"] input`); if (again) again.focus();
      return;
    }
    if (f.id === "taskForm") {
      const isNew = ui.sheet.isNew, wantCal = isNew && ui.sheet.addCal;
      const t = applyEdit(); if (!t) return;
      ui.sheet = null;
      if (wantCal) { addToAppleCalendar(t); return; }
      commit(); toast(isNew ? "已新增" : t.calStale ? "已儲存・行事曆要再加一次" : "已儲存");
      return;
    }
    if (f.id === "newListForm") {
      const name = $("#newListName").value.trim(); if (!name) return;
      state.lists.push({ id: uid(), name }); commit(); toast("已新增分類「" + name + "」"); return;
    }
    if (f.dataset.renameform) {
      const id = f.dataset.renameform, name = $("#rn-" + id).value.trim();
      if (name) state.lists.find(l => l.id === id).name = name;
      ui.editingList = null; commit();
    }
  });

  document.addEventListener("keydown", e => { if (e.key === "Escape" && ui.sheet) { ui.sheet = null; renderSheet(); } });

  // ---------- backup ----------
  function exportBackup() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const file = new File([blob], `備忘錄備份-${todayStr()}.json`, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: "備忘錄備份" }).catch(() => {});
      return;
    }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
  }
  $("#importFile").addEventListener("change", e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const s = JSON.parse(r.result);
        if (!s || !Array.isArray(s.lists) || !Array.isArray(s.tasks)) throw 0;
        state = s; commit(); toast(`已還原 ${s.tasks.length} 項任務`);
      } catch (_) { toast("這個檔案不是備忘錄的備份"); }
      e.target.value = "";
    };
    r.readAsText(f);
  });

  function loadSample() {
    const L = name => { let l = state.lists.find(x => x.name === name); if (!l) { l = { id: uid(), name }; state.lists.push(l); } return l.id; };
    const mk = (list, title, date = "", time = "", extra = {}) =>
      ({ id: uid(), listId: L(list), title: "（範例）" + title, date, time, mins: 30, alarm: "", star: false, done: false, created: Date.now(), ...extra });
    state.tasks.push(
      mk("工作", "交婚紗修圖檔", addDays(-2), "", { star: true }),
      mk("工作", "回覆客戶報價", addDays(0), "10:00"),
      mk("工作", "分鏡練習", addDays(3), "14:00"),
      mk("個人", "繳電話費", addDays(-1)),
      mk("個人", "整理作品集"),
      mk("要買什麼", "相機電池 NP-W126S", addDays(1)),
      mk("要買什麼", "去全聯", addDays(0), "", { subs: ["衛生紙", "青菜", "醬油"].map(text => ({ id: uid(), text, done: false })) }),
      mk("個人", "洗衣服", "", "", { done: true, doneAt: Date.now() }),
    );
    commit();
  }
  function loadSamplePost() {
    const at = (days, h) => { const d = now(); d.setDate(d.getDate() + days); d.setHours(h, 0, 0, 0); return d; };
    state.projects.push(
      { id: uid(), name: "（範例）婚紗 MV 剪輯", client: "陳先生", due: addDays(6), progress: 40, created: Date.now(),
        stages: [{ id: uid(), name: "粗剪", pct: 100 }, { id: uid(), name: "調色", pct: 20 }, { id: uid(), name: "字幕", pct: 0 }],
        sessions: [{ id: uid(), date: addDays(-1), start: "14:00", end: "17:00", target: 45, reported: false, calAdded: true },
                   { id: uid(), date: addDays(1), start: "13:00", end: "16:00", target: 55, reported: false, calAdded: false }],
        log: [{ at: at(-3, 18).getTime(), from: 0, to: 20, note: "粗剪完成", sid: null }, { at: at(-2, 21).getTime(), from: 20, to: 35, note: "", sid: null }] },
      { id: uid(), name: "（範例）品牌形象短片調色", client: "咖啡店", due: addDays(2), progress: 70, created: Date.now(), sessions: [], log: [] },
      { id: uid(), type: "study", name: "（範例）影視概論期中考", client: "影視概論", due: addDays(9), progress: 38, created: Date.now(), log: [],
        stages: [{ id: uid(), name: "第 1 章", pct: 100 }, { id: uid(), name: "第 2 章", pct: 50 }, { id: uid(), name: "第 3 章", pct: 0 }, { id: uid(), name: "寫考古題", pct: 0 }],
        sessions: [{ id: uid(), date: addDays(-2), start: "19:00", end: "21:00", target: 25, reported: true, result: 25, calAdded: true }] },
      { id: uid(), type: "learn", name: "（範例）學 DaVinci 調色", client: "YouTube 教學", due: addDays(30), progress: 10, created: Date.now(), log: [], sessions: [],
        stages: [{ id: uid(), name: "看教學", pct: 30 }, { id: uid(), name: "跟著練", pct: 0 }, { id: uid(), name: "做一個小作品", pct: 0 }] },
    );
    commit();
  }
  function loadSamplePrep() {
    const items = (cat, list, doneN = 0) => list.map((text, i) => ({ id: uid(), cat, text, done: i < doneN }));
    state.preps.push(
      { id: uid(), name: "（範例）《夏至》畢製劇組", kind: "劇組", role: "攝影助理", date: addDays(4), time: "07:30", place: "台中霧峰", note: "早上要先去器材室領腳架", created: Date.now(),
        items: [...items("gear", DEFAULT_KIT, 2), ...items("skill", ["跟焦練習", "複習 X-T3 的 F-Log 設定"]), ...items("todo", ["看分鏡表", "確認集合地點"], 1)] },
      { id: uid(), name: "（範例）咖啡店商品拍攝", kind: "案子", role: "攝影", date: addDays(10), time: "", place: "", note: "", created: Date.now(),
        items: items("todo", ["跟老闆確認拍幾支商品", "找參考圖"]) },
    );
    commit();
  }

  // ---------- boot ----------
  state = load() || fresh();
  if (!state.active) state.active = ALL;
  state.projects = state.projects || [];
  state.preps = state.preps || [];
  state.gearKit = state.gearKit || DEFAULT_KIT.slice();
  render();
  // a work session may end while the app is open: refresh so the 回報 banner appears
  let lastPending = pendingReports().length;
  setInterval(() => { if (!document.hidden && !ui.sheet && pendingReports().length !== lastPending) { lastPending = pendingReports().length; render(); } }, 60000);
  // re-render when the app comes back the next day so 今天/以前的 stay right
  let lastDay = todayStr();
  document.addEventListener("visibilitychange", () => { if (!document.hidden && todayStr() !== lastDay) { lastDay = todayStr(); render(); } });
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
